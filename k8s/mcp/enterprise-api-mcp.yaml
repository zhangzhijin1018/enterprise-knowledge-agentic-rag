# =============================================================================
# Enterprise API MCP K8s Deployment
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-api-mcp
  namespace: enterprise-agent
  labels:
    app: enterprise-api-mcp
    tier: mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-api-mcp
  template:
    metadata:
      labels:
        app: enterprise-api-mcp
        tier: mcp
    spec:
      containers:
        - name: enterprise-api-mcp
          image: enterprise-agent/enterprise-api-mcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5003
              name: http
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LOG_LEVEL
              value: "INFO"
            - name: ENTERPRISE_API_MODE
              value: "simulation"  # 模拟模式，后续切换真实 API
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /mcp/v1/health
              port: 5003
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /mcp/v1/health
              port: 5003
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-api-mcp-svc
  namespace: enterprise-agent
  labels:
    app: enterprise-api-mcp
spec:
  type: ClusterIP
  ports:
    - port: 5003
      targetPort: 5003
      protocol: TCP
      name: http
  selector:
    app: enterprise-api-mcp
