# =============================================================================
# Supervisor K8s Deployment - 统一入口服务
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: supervisor
  namespace: enterprise-agent
  labels:
    app: supervisor
    tier: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: supervisor
  template:
    metadata:
      labels:
        app: supervisor
        tier: gateway
    spec:
      containers:
        - name: supervisor
          image: enterprise-agent/supervisor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LOG_LEVEL
              value: "INFO"
            # Agent 端点配置
            - name: RAG_AGENT_URL
              value: "http://rag-agent-svc.enterprise-agent.svc.cluster.local:6001"
            - name: ANALYTICS_AGENT_URL
              value: "http://analytics-agent-svc.enterprise-agent.svc.cluster.local:6002"
            - name: CONTRACT_AGENT_URL
              value: "http://contract-agent-svc.enterprise-agent.svc.cluster.local:6003"
            - name: POLICY_AGENT_URL
              value: "http://policy-agent-svc.enterprise-agent.svc.cluster.local:6004"
            # Redis 配置
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: redis_url
            # LLM 配置
            - name: LLM_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: llm_gateway_url
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: supervisor-svc
  namespace: enterprise-agent
  labels:
    app: supervisor
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: supervisor
---
# =============================================================================
# Supervisor Ingress - 对外暴露
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: supervisor-ingress
  namespace: enterprise-agent
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: agent.enterprise.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: supervisor-svc
                port:
                  number: 8000
