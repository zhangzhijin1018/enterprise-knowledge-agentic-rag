# =============================================================================
# Analytics Agent K8s Deployment
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-agent
  namespace: enterprise-agent
  labels:
    app: analytics-agent
    tier: agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-agent
  template:
    metadata:
      labels:
        app: analytics-agent
        tier: agent
    spec:
      containers:
        - name: analytics-agent
          image: enterprise-agent/analytics-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6002
              name: http
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LOG_LEVEL
              value: "INFO"
            - name: ANALYTICS_SQL_GATEWAY_TRANSPORT_MODE
              value: "http"  # 切换到 HTTP 调用 SQL MCP
            - name: SQL_MCP_URL
              value: "http://sql-mcp-svc.enterprise-agent.svc.cluster.local:5001"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: redis_url
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /a2a/health
              port: 6002
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /a2a/health
              port: 6002
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-agent-svc
  namespace: enterprise-agent
  labels:
    app: analytics-agent
spec:
  type: ClusterIP
  ports:
    - port: 6002
      targetPort: 6002
      protocol: TCP
      name: http
  selector:
    app: analytics-agent
