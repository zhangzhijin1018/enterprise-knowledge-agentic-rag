# =============================================================================
# Grafana Loki 配置文件
# =============================================================================
#
# Loki 是日志聚合系统，专门为 Prometheus 设计
#
# =============================================================================

server:
  # HTTP 服务配置
  http_listen_port: 3100

# 日志存储位置
common:
  path_prefix: /loki
  storage:
    # 使用文件系统存储
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

# Schema 配置
schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# 日志保留期
limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # 最大条目大小
  max_entries_limit_per_query: 5000
  # 保留期（天）
  retention_period: 30d

# 存储配置
storage_config:
  boltdb:
    directory: /loki/index

  filesystem:
    directory: /loki/chunks

# 块配置
chunk_store_config:
  # 缓存配置
  cache_lookups_older_than: 10m

# 查询配置
query_range:
  # 并行查询数
  parallelise_shardable_queries: true
