[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "enterprise-knowledge-agentic-rag"
version = "0.1.0"
description = "新疆能源集团知识与生产经营智能 Agent 平台项目骨架"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "langgraph>=0.2,<1.0",
  "langchain>=0.3.0,<1.0",
  "langchain-core>=0.3.0,<1.0",
  "pdfplumber>=0.11,<1.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "PyMuPDF>=1.24,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.4,<3.0",
  "redis>=5.0,<6.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-a2a>=0.5.0",
  "httpx>=0.27.0",
  # =========================================================
  # 可观测性框架（主流生产级方案）
  # =========================================================
  # structlog: 结构化日志，Python 结构化日志的事实标准
  "structlog>=24.0,<25.0",
  # OpenTelemetry: CNCF 毕业项目，分布式追踪事实标准
  "opentelemetry-api>=1.20,<2.0",
  "opentelemetry-sdk>=1.20,<2.0",
  # OpenTelemetry 导出器
  "opentelemetry-exporter-otlp>=1.20,<2.0",  # OTLP 协议导出（发送到 Collector）
  "opentelemetry-exporter-prometheus>=0.41b0",  # Prometheus 导出
  # OpenTelemetry 自动埋点（FastAPI/httpx 自动注入 trace）
  "opentelemetry-instrumentation-fastapi>=0.41b0",
  "opentelemetry-instrumentation-httpx>=0.41b0",
  "opentelemetry-instrumentation-logging>=0.41b0",
  # Prometheus 客户端（指标采集）
  "prometheus-client>=0.19,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.hatch.build.targets.wheel]
packages = ["apps", "core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
